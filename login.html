<!DOCTYPE html>
<html>
<head>
<title>Login - Hoppin</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #007BFF, #00A8FF);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.login-box {
    background: white;
    padding: 30px;
    border-radius: 15px;
    width: 300px;
    text-align: center;
}

.login-box h2 {
    margin-bottom: 20px;
}

.login-box input {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #ddd;
}

.login-box button {
    width: 100%;
    padding: 10px;
    background: #007BFF;
    color: white;
    border: none;
    border-radius: 20px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="login-box">
    <h2>Login to Hoppin</h2>

    <input type="text" id="username" placeholder="Enter your name">
    <input type="password" placeholder="Password">

    <button onclick="login()">Login</button>
</div>

<script>
function login() {
    let user = document.getElementById("username").value;

    if(user === "") {
        alert("Enter your name");
        return;
    }

    localStorage.setItem("user", user);
    window.location.href = "index.html";
}
</script>

</body>
</html>
