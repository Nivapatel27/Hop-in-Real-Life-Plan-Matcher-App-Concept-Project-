<!DOCTYPE html>
<html>
<head>
<title>Profile - Hoppin</title>

<style>
body {
    font-family: "Segoe UI";
    margin: 0;
    background: #f4f8ff;
}

header {
    background: white;
    padding: 15px 40px;
    display: flex;
    justify-content: space-between;
}

nav a {
    margin-left: 20px;
    text-decoration: none;
    color: #333;
}

.container {
    max-width: 800px;
    margin: auto;
    padding: 30px;
}

/* PROFILE CARD */
.profile-card {
    background: linear-gradient(135deg, #007BFF, #00A8FF);
    color: white;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
}

/* IMAGE */
.profile-card img {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 4px solid white;
}

/* INFO */
.info {
    margin-top: 20px;
    text-align: left;
}

.info p {
    margin: 8px 0;
}

/* STATS */
.stats {
    display: flex;
    justify-content: space-around;
    margin-top: 15px;
}

.stats div {
    text-align: center;
}

/* BUTTONS */
button {
    margin-top: 10px;
    padding: 10px 15px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
}

.edit {
    background: white;
    color: #007BFF;
}

.logout {
    background: red;
    color: white;
}
</style>

</head>

<body>

<header>
    <h2>Hoppin</h2>
    <nav>
        <a href="index.html">Home</a>
        <a href="explore.html">Explore</a>
        <a href="chat.html">Chat</a>
        <a href="profile.html">Profile</a>
    </nav>
</header>

<div class="container">

<div class="profile-card">

    <img src="">

    <h2 id="usernameDisplay"></h2>

    ⭐⭐⭐⭐☆

    <!-- STATS -->
    <div class="stats">
        <div>
            <h3 id="createdCount">0</h3>
            <p>Created</p>
        </div>
        <div>
            <h3 id="joinedCount">0</h3>
            <p>Joined</p>
        </div>
    </div>

    <!-- INFO -->
    <div class="info">
        <p id="address">📍 Address: Not set</p>
        <p id="contact">📞 Contact: Not set</p>
        <p id="email">📧 Email: Not set</p>
    </div>

    <!-- BUTTONS -->
    <button class="edit" onclick="editProfile()">✏️ Edit</button>
    <button class="logout" onclick="logout()">Logout</button>

</div>

</div>

<script>

// LOAD USERNAME
document.getElementById("usernameDisplay").innerText = localStorage.getItem("user");

// LOAD SAVED DATA
document.getElementById("address").innerText = localStorage.getItem("address") || "📍 Address: Not set";
document.getElementById("contact").innerText = localStorage.getItem("contact") || "📞 Contact: Not set";
document.getElementById("email").innerText = localStorage.getItem("email") || "📧 Email: Not set";

// LOAD COUNTS
document.getElementById("createdCount").innerText = localStorage.getItem("created") || 0;
document.getElementById("joinedCount").innerText = localStorage.getItem("joined") || 0;


// EDIT PROFILE
function editProfile() {
    let address = prompt("Enter your address:");
    let contact = prompt("Enter your contact number:");
    let email = prompt("Enter your email:");

    if(address) localStorage.setItem("address", "📍 Address: " + address);
    if(contact) localStorage.setItem("contact", "📞 Contact: " + contact);
    if(email) localStorage.setItem("email", "📧 Email: " + email);

    location.reload();
}


// LOGOUT
function logout() {
    localStorage.clear();
    window.location.href = "login.html";
}

</script>

</body>
</html>
